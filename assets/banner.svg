<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Drop Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .float-item {
      animation: float 6s ease-in-out infinite alternate;
    }
    .dash-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- Main Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Dynamic Dynamic Tech Grid / Network Nodes in Background -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="140" fill="#06b6d4" class="pulse-circle" filter="url(#glowCyan)"/>
    <circle cx="1050" cy="320" r="180" fill="#8b5cf6" class="pulse-circle" filter="url(#glowPurple)"/>
    
    <!-- Grid Lines -->
    <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 200 0 V 400 M 400 0 V 400 M 600 0 V 400 M 800 0 V 400 M 1000 0 V 400" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Animated Data Pipeline Node Lines -->
    <path d="M 150 320 C 350 260, 500 350, 700 280 T 1100 200" stroke="url(#cyanPurple)" stroke-width="3" fill="none" class="dash-line"/>
    <path d="M 50 150 C 300 100, 600 220, 850 120 T 1150 140" stroke="url(#emeraldTeal)" stroke-width="2" fill="none" class="dash-line"/>
  </g>

  <!-- Background Decorative Glowing Data Nodes (Non-obstructive) -->
  <g class="float-item">
    <!-- DNA / Molecule Motif Element -->
    <g transform="translate(980, 80)" opacity="0.6">
      <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
      <circle cx="60" cy="40" r="12" fill="#8b5cf6"/>
      <circle cx="30" cy="90" r="10" fill="#10b981"/>
      <line x1="0" y1="0" x2="60" y2="40" stroke="#475569" stroke-width="2"/>
      <line x1="60" y1="40" x2="30" y2="90" stroke="#475569" stroke-width="2"/>
      <line x1="30" y1="90" x2="0" y2="0" stroke="#475569" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground Content Container -->
  <!-- Category Pill Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="36" rx="18" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#10b981"/>
    <text x="36" y="23" class="badge-text">CLINICAL DATA MANAGEMENT</text>
  </g>

  <!-- Foreground Title (Guaranteed Clear & High Contrast) -->
  <text x="80" y="170" class="title">Awesome Clinical Data Management</text>

  <!-- Foreground Subtitle -->
  <text x="80" y="215" class="subtitle">A Curated Ecosystem of SaaS Platforms, Open-Source EDC, CDISC Tools &amp; Data Pipelines</text>

  <!-- Feature Highlights / Tags Row -->
  <g transform="translate(80, 275)">
    <!-- Tag 1: EDC Platforms -->
    <g transform="translate(0, 0)">
      <rect width="160" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🏥 EDC Platforms</text>
    </g>

    <!-- Tag 2: CDISC Standards -->
    <g transform="translate(180, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">📊 CDISC &amp; SDTM</text>
    </g>

    <!-- Tag 3: 21 CFR Part 11 -->
    <g transform="translate(380, 0)">
      <rect width="190" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🔐 21 CFR Part 11</text>
    </g>

    <!-- Tag 4: Open-Source -->
    <g transform="translate(590, 0)">
      <rect width="170" height="42" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">⚡ Open-Source</text>
    </g>
  </g>
</svg>
